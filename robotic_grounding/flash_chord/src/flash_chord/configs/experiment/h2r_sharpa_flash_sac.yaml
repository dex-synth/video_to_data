# @package _global_
# Explicit H2R adaptation: 1x source motion, 30 Hz control, scalar virtual wrists.
defaults:
  - sharpa_flash_sac
  - override /embodiment: h2r_sharpa_hands
  - _self_

task:
  motion_speed: 1.0
  motion_start_frame: 0
  motion_end_frame: -1
sim:
  fps: 30.0
  substeps: 4
scene:
  support: true
  decompose_objects: false
  object_scale_min: 1.0
  object_scale_max: 1.0
collision:
  ground: false
  robot_support_collision: true
action:
  _target_: flash_chord.h2r.action.H2rActionConfig
logging:
  run_name: h2r_sharpa_flash_sac
